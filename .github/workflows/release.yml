name: Release

# Ao publicar uma tag (ex.: git tag v0.2.0 && git push origin v0.2.0), gera o instalador do Windows (.exe)
# e o pacote do Linux (.deb) e os anexa a uma Release. Em "Run workflow" (manual) só gera os arquivos,
# que ficam para baixar na página da execução, sem criar Release.
# O texto da Release vem da mensagem da tag: git tag -a v0.3.0 -F notas.md && git push origin v0.3.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
        env:
          # opcionais: ID e segredo do Google, embutidos no programa (veja o .env.example)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: pauta-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev libxdo-dev build-essential pkg-config
      - run: npm ci
      - run: npm run build -- --bundles deb
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: pauta-linux
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: arquivos
          merge-multiple: true
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O texto da Release é a mensagem da tag (git tag -a v1.2.3 -m "..."). Sem mensagem, usa o texto automático.
          git fetch --force --tags
          git tag -l "$GITHUB_REF_NAME" --format='%(contents)' > notas.md
          if [ -s notas.md ]; then NOTAS="--notes-file notas.md"; else NOTAS="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" arquivos/* --repo "$GITHUB_REPOSITORY" --title "Pauta $GITHUB_REF_NAME" $NOTAS
